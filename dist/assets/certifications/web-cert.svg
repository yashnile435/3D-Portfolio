<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="webCertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#172540"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#webCertBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="15" stroke="#1e3a66" stroke-width="1.5"/>

  <!-- Ornate Border -->
  <rect x="12" y="12" width="376" height="216" rx="10" stroke="#254d87" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- React / Code Atoms Emblem -->
  <g transform="translate(200, 95)">
    <circle cx="0" cy="0" r="42" fill="#152642" stroke="#38bdf8" stroke-width="2"/>
    <!-- React Atom Rings -->
    <ellipse cx="0" cy="0" rx="28" ry="11" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <ellipse cx="0" cy="0" rx="28" ry="11" stroke="#38bdf8" stroke-width="2" fill="none" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="28" ry="11" stroke="#38bdf8" stroke-width="2" fill="none" transform="rotate(120)"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="5" fill="url(#cyanGrad)"/>
  </g>

  <!-- Typography -->
  <text x="200" y="176" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">FULL STACK &amp; REACT</text>
  <text x="200" y="198" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">MODERN WEB SYSTEMS</text>
</svg>
