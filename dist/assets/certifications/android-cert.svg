<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="andCertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1d1a"/>
      <stop offset="100%" stop-color="#142c27"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#andCertBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="15" stroke="#1f4a41" stroke-width="1.5"/>

  <!-- Ornate Border -->
  <rect x="12" y="12" width="376" height="216" rx="10" stroke="#256155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Android Robot Emblem -->
  <g transform="translate(200, 95)">
    <circle cx="0" cy="0" r="42" fill="#15362f" stroke="#10b981" stroke-width="2"/>
    <!-- Head -->
    <path d="M-20 -5 A20 20 0 0 1 20 -5 Z" fill="url(#greenGrad)"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-12" r="2.5" fill="#0c1d1a"/>
    <circle cx="8" cy="-12" r="2.5" fill="#0c1d1a"/>
    <!-- Antennas -->
    <line x1="-12" y1="-20" x2="-16" y2="-28" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-20" x2="16" y2="-28" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Body snippet -->
    <rect x="-20" y="0" width="40" height="15" rx="4" fill="url(#greenGrad)"/>
  </g>

  <!-- Typography -->
  <text x="200" y="176" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ANDROID DEVELOPMENT</text>
  <text x="200" y="198" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">KOTLIN &amp; NATIVE APPS</text>
</svg>
