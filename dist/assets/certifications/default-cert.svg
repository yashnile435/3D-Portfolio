<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121422"/>
      <stop offset="100%" stop-color="#1c1f36"/>
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#certBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="15" stroke="#2e324c" stroke-width="1.5"/>

  <!-- Ornate Border -->
  <rect x="12" y="12" width="376" height="216" rx="10" stroke="#3d4263" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Center Badge / Shield -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="0" r="42" fill="#241e3d" stroke="#a855f7" stroke-width="2"/>
    <!-- Ribbon -->
    <path d="M-22 30 L-28 65 L0 52 L28 65 L22 30 Z" fill="#9333ea" opacity="0.8"/>
    <!-- Award Star / Icon -->
    <path d="M0 -22 L6 -8 L21 -8 L9 2 L14 17 L0 8 L-14 17 L-9 2 L-21 -8 L-6 -8 Z" fill="url(#purpleGold)"/>
  </g>

  <!-- Typography -->
  <text x="200" y="180" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">VERIFIED CREDENTIAL</text>
  <text x="200" y="200" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">PROFESSIONAL ACCREDITATION</text>
</svg>
