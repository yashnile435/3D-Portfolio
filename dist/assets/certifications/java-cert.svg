<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="jcertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181126"/>
      <stop offset="100%" stop-color="#24173d"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#jcertBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="15" stroke="#43286b" stroke-width="1.5"/>

  <!-- Ornate Border -->
  <rect x="12" y="12" width="376" height="216" rx="10" stroke="#5b3791" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Java Cup Icon / Emblem -->
  <g transform="translate(200, 95)">
    <circle cx="0" cy="0" r="42" fill="#2d1c4a" stroke="#a855f7" stroke-width="2"/>
    <!-- Steam Lines -->
    <path d="M-10 -20 C-12 -28 -5 -32 -8 -40" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M0 -22 C-2 -30 5 -34 2 -42" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M10 -20 C8 -28 15 -32 12 -40" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cup -->
    <path d="M-18 -10 L18 -10 L15 15 C15 22 -15 22 -15 15 Z" fill="url(#javaGrad)"/>
    <!-- Handle -->
    <path d="M16 -5 C24 -5 24 10 16 10" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography -->
  <text x="200" y="176" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">JAVA &amp; SPRING BOOT</text>
  <text x="200" y="198" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">ENTERPRISE ARCHITECTURE</text>
</svg>
