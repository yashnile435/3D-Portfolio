<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="ottBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d24"/>
      <stop offset="100%" stop-color="#21133b"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="netflixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#ottBg)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" stroke="#3b2361" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#110a1f"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="540" y="25" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Flutter • Dart • Firebase</text>

  <!-- Left Side: Mobile Device Mockup -->
  <g transform="translate(45, 55)">
    <!-- Device Frame -->
    <rect width="160" height="300" rx="20" fill="#1e1336" stroke="#4c2882" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="10" width="144" height="280" rx="14" fill="#180e2b"/>
    <!-- Top Camera Notch -->
    <rect x="60" y="14" width="40" height="5" rx="2.5" fill="#2d174d"/>
    <!-- Mobile App Header -->
    <rect x="8" y="24" width="144" height="34" fill="#291547"/>
    <text x="20" y="46" fill="#f0abfc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">OTT Subscriptions</text>

    <!-- OTT Card 1: Netflix -->
    <g transform="translate(16, 68)">
      <rect width="128" height="52" rx="8" fill="#24133d" stroke="#5b21b6"/>
      <rect x="8" y="8" width="22" height="22" rx="4" fill="url(#netflixGrad)"/>
      <text x="19" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">N</text>
      <text x="36" y="20" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Netflix Premium</text>
      <text x="36" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">4 Members Split</text>
      <text x="36" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">Renews: 12 Oct</text>
    </g>

    <!-- OTT Card 2: Prime -->
    <g transform="translate(16, 126)">
      <rect width="128" height="52" rx="8" fill="#24133d" stroke="#3b1f66"/>
      <rect x="8" y="8" width="22" height="22" rx="4" fill="url(#primeGrad)"/>
      <text x="19" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">P</text>
      <text x="36" y="20" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Prime Video</text>
      <text x="36" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Annual Plan</text>
      <text x="36" y="44" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="8">Watching: S3 E4</text>
    </g>

    <!-- OTT Card 3: Disney+ Hotstar -->
    <g transform="translate(16, 184)">
      <rect width="128" height="52" rx="8" fill="#24133d" stroke="#3b1f66"/>
      <rect x="8" y="8" width="22" height="22" rx="4" fill="#1e3a8a"/>
      <text x="19" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">D</text>
      <text x="36" y="20" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Disney+ Hotstar</text>
      <text x="36" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Family Plan</text>
      <text x="36" y="44" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8">Active Watchlist</text>
    </g>

    <rect x="52" y="280" width="56" height="3" rx="1.5" fill="#6b21a8"/>
  </g>

  <!-- Right Side: Architecture & Features -->
  <g transform="translate(235, 60)">
    <text x="0" y="22" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Android OTT Manager Architecture</text>
    <text x="0" y="44" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Mobile client for streaming subscription tracking, group splits &amp; watch status.</text>

    <!-- Metrics Grid -->
    <g transform="translate(0, 65)">
      <rect width="150" height="95" rx="10" fill="#24143d" stroke="#3d2166"/>
      <text x="16" y="28" fill="#d946ef" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">MULTI-STREAM</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Unified Subscriptions</text>
      <text x="16" y="74" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Monthly &amp; Annual Billing</text>
    </g>

    <g transform="translate(165, 65)">
      <rect width="155" height="95" rx="10" fill="#24143d" stroke="#3d2166"/>
      <text x="16" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GROUP SPLIT</text>
      <text x="16" y="52" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Cost Sharing</text>
      <text x="16" y="74" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Shared accounts &amp; dues</text>
    </g>

    <!-- Capabilities Box -->
    <g transform="translate(0, 180)">
      <rect width="320" height="90" rx="10" fill="#1c0f33" stroke="#371d5c"/>
      <text x="16" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Mobile Engineering Stack</text>
      <text x="16" y="48" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Flutter &amp; Dart cross-platform mobile client</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">• Firebase Firestore state synchronization across devices</text>
    </g>
  </g>
</svg>
