<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="blogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#161928"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#blogBg)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" stroke="#25283d" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#131522"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="540" y="25" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">HTML5 • CSS3 • JS • MySQL</text>

  <!-- Blog Interface Layout -->
  <!-- Left Side: Article Navigation -->
  <g transform="translate(30, 60)">
    <rect width="160" height="290" rx="10" fill="#181a29" stroke="#2b2e47"/>
    <text x="16" y="32" fill="#c4b5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">TECHNICAL POSTS</text>
    
    <rect x="12" y="50" width="136" height="36" rx="6" fill="#2d1f4d"/>
    <text x="20" y="73" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Java Memory &amp; GC</text>

    <text x="20" y="115" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Android MVVM Flow</text>
    <text x="20" y="150" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">MySQL Index Tuning</text>
    <text x="20" y="185" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">React Reconciliation</text>
    <text x="20" y="220" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">CSS Grid vs Flexbox</text>
  </g>

  <!-- Right Side: Article Reader View -->
  <g transform="translate(210, 60)">
    <rect width="360" height="290" rx="10" fill="#131522" stroke="#2b2e47"/>
    <text x="24" y="34" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Understanding Java Virtual Machine Memory</text>
    <text x="24" y="55" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">BY YASH NILE • 6 MIN READ • CORE JAVA</text>

    <!-- Code Block -->
    <rect x="24" y="75" width="312" height="110" rx="8" fill="#0d0e17" stroke="#25283d"/>
    <text x="38" y="100" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">// JVM Heap Structure Overview</text>
    <text x="38" y="122" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">public class</text>
    <text x="125" y="122" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10">MemoryLifecycle {</text>
    <text x="50" y="142" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">EdenSpace</text>
    <text x="115" y="142" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10">eden = new EdenSpace();</text>
    <text x="50" y="162" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">SurvivorSpace</text>
    <text x="145" y="162" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10">s0 = eden.promote();</text>
    <text x="38" y="177" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10">}</text>

    <!-- Text Paragraph Mockup -->
    <text x="24" y="215" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">In standard JVM runtimes, objects are allocated in the Eden</text>
    <text x="24" y="235" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">generation. When minor garbage collection triggers, alive references</text>
    <text x="24" y="255" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">are moved into survivor spaces before tenuring...</text>
  </g>
</svg>
