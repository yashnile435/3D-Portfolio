<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="dbCertBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#261b40"/>
    </linearGradient>
    <linearGradient id="pinkPurp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#dbCertBg)"/>
  <rect x="1" y="1" width="398" height="238" rx="15" stroke="#482d73" stroke-width="1.5"/>

  <!-- Ornate Border -->
  <rect x="12" y="12" width="376" height="216" rx="10" stroke="#5d3994" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Database Cylinders Emblem -->
  <g transform="translate(200, 95)">
    <circle cx="0" cy="0" r="42" fill="#2d1c47" stroke="#e879f9" stroke-width="2"/>
    <!-- Stack 1 -->
    <ellipse cx="0" cy="-14" rx="22" ry="7" fill="url(#pinkPurp)"/>
    <path d="M-22 -14 L-22 0 A22 7 0 0 0 22 0 L22 -14 Z" fill="#9333ea" opacity="0.8"/>
    <!-- Stack 2 -->
    <path d="M-22 2 L-22 16 A22 7 0 0 0 22 16 L22 2 Z" fill="#7c3aed" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="200" y="176" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">RELATIONAL DATABASES</text>
  <text x="200" y="198" fill="#e879f9" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SQL &amp; SCHEMA ARCHITECTURE</text>
</svg>
