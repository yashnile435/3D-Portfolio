<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131d" />
      <stop offset="50%" stop-color="#1e1b38" />
      <stop offset="100%" stop-color="#2d1b4e" />
    </linearGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b998" />
      <stop offset="100%" stop-color="#cf9b75" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24273a" />
      <stop offset="100%" stop-color="#181a27" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="180" r="130" fill="#9333ea" opacity="0.18" filter="url(#purpleGlow)" />
  <circle cx="280" cy="120" r="80" fill="#38bdf8" opacity="0.12" filter="url(#purpleGlow)" />

  <!-- Outer Neon Border Ring -->
  <circle cx="200" cy="190" r="150" stroke="url(#purpleRing)" stroke-width="3" stroke-dasharray="6 6" opacity="0.5" />

  <!-- Silhouette / Stylized Portrait -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Jacket -->
    <path d="M100 370 C100 290 140 270 200 270 C260 270 300 290 300 370 Z" fill="url(#shirtGrad)" stroke="#3b3f5c" stroke-width="2" />
    <!-- Collar / Inner Shirt -->
    <path d="M170 270 L200 320 L230 270 Z" fill="#9333ea" opacity="0.4" />
    <!-- Neck -->
    <path d="M180 220 L180 275 L220 275 L220 220 Z" fill="url(#skinGrad)" />
    <!-- Head Base -->
    <ellipse cx="200" cy="185" rx="52" ry="62" fill="url(#skinGrad)" />
    <!-- Hair Modern Cut -->
    <path d="M148 180 C145 130 165 110 200 110 C240 110 255 130 252 180 C248 160 230 145 200 145 C170 145 152 160 148 180 Z" fill="#1e182e" />
    <!-- Glasses / Modern Frame -->
    <rect x="162" y="172" width="30" height="20" rx="6" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <rect x="208" y="172" width="30" height="20" rx="6" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <line x1="192" y1="182" x2="208" y2="182" stroke="#a855f7" stroke-width="2.5" />
    <!-- Glasses Glint -->
    <line x1="166" y1="176" x2="178" y2="176" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="212" y1="176" x2="224" y2="176" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <!-- Smile -->
    <path d="M188 220 Q200 228 212 220" stroke="#8c5839" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Developer Tech Accents -->
  <g transform="translate(40, 40)">
    <rect width="64" height="26" rx="6" fill="#181a27" stroke="#9333ea" stroke-width="1.5" opacity="0.9" />
    <text x="32" y="17" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">&lt;dev/&gt;</text>
  </g>

  <g transform="translate(295, 330)">
    <rect width="70" height="26" rx="6" fill="#181a27" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="35" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">MCA '27</text>
  </g>
</svg>
