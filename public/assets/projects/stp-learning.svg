  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="540" y="25" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">React • Cloud Firestore</text>

