<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <linearGradient id="travelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e38"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#travelBg)"/>
  <rect x="1" y="1" width="598" height="378" rx="15" stroke="#334155" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0b1120"/>
  <circle cx="28" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="540" y="25" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">React • PHP • MySQL</text>

  <!-- Banner -->
  <g transform="translate(30, 60)">
    <rect width="540" height="50" rx="8" fill="#1e293b"/>
    <text x="20" y="32" fill="#fef3c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Bappa Taxi Services — Fleet &amp; Tariff Booking</text>
  </g>

  <!-- Fleet Cards -->
  <g transform="translate(30, 125)">
    <!-- Sedan -->
    <rect width="168" height="135" rx="10" fill="#151b2e" stroke="#2d3748"/>
    <rect x="14" y="14" width="140" height="40" rx="6" fill="#0f172a"/>
    <text x="84" y="38" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sedan (Dzire / Etios)</text>
    <text x="14" y="76" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Capacity: 4 Passengers</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Air Conditioned • Dual Airbags</text>
    <text x="14" y="118" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">₹12 / km</text>
  </g>

  <g transform="translate(216, 125)">
    <!-- SUV -->
    <rect width="168" height="135" rx="10" fill="#1e2238" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="14" y="14" width="140" height="40" rx="6" fill="#2d2212"/>
    <text x="84" y="38" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SUV (Innova / Ertiga)</text>
    <text x="14" y="76" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Capacity: 7 Passengers</text>
    <text x="14" y="94" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Spacious Trunk • AC</text>
    <text x="14" y="118" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">₹18 / km</text>
  </g>

  <g transform="translate(402, 125)">
    <!-- Tempo Traveller -->
    <rect width="168" height="135" rx="10" fill="#151b2e" stroke="#2d3748"/>
    <rect x="14" y="14" width="140" height="40" rx="6" fill="#0f172a"/>
    <text x="84" y="38" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Group Traveller</text>
    <text x="14" y="76" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Capacity: 17 Passengers</text>
    <text x="14" y="94" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Outstation Tours &amp; Events</text>
    <text x="14" y="118" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">₹26 / km</text>
  </g>

  <!-- Route Booking Calculator Bar -->
  <g transform="translate(30, 275)">
    <rect width="540" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="28" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">ORIGIN &amp; DESTINATION</text>
    <text x="24" y="52" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Pune ➔ Shirdi Outstation Package (480 km total)</text>
    <rect x="420" y="20" width="96" height="36" rx="6" fill="url(#amberGold)"/>
    <text x="468" y="43" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book Trip</text>
  </g>
</svg>
